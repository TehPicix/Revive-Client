# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.configuration-cache=false

# Fabric Properties (https://fabricmc.net/develop)
# The Revive loader is a Fabric preLaunch entrypoint that uses only the Fabric Loader API (no
# Minecraft classes, no mixins, no mappings), so it builds as a plain Java jar — no Loom needed.
loader_version=0.18.2
minecraft_version=1.21.11

# Mod Properties
archives_base_name=revive-loader
maven_group=revivedevelopment.loader
